[project]
name = "devin-issue-remediator"
version = "0.1.0"
description = "Event-driven GitHub issue remediation using the Devin API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "ruff>=0.7.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# FastAPI's Depends() in argument defaults is idiomatic.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
